<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Codex Apps</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #aaa;
        }

        .games {
            max-width: 1000px;
            margin: auto;
            padding: 30px;

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: #1e1e1e;
            border-radius: 18px;
            padding: 18px;
            text-decoration: none;
            color: white;
            text-align: center;

            transition:
                transform 0.2s,
                background 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            background: #292929;
        }

        .game-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 15px;
        }

        .game-card h2 {
            margin: 15px 0 8px;
            font-size: 20px;
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #aaa;
            font-size: 13px;
        }

        .download {
            display: block;
            margin-top: 14px;
            font-size: 14px;
            color: white;
        }

        .error {
            color: #d88888;
        }
    </style>
</head>

<body>

<header>
    <h1>CloudMuse Apps</h1>
    <p>Mes jeux et applications Android</p>
</header>

<div class="games" id="games"></div>

<script>

const GITHUB_USER = "cloudmuseapp";
const GITHUB_REPO = "cloudmuse-apks";

const games = [
    {
        id: "brique",
        name: "Brique",
        logo: "images/logo-brique.png",
        apk: "brique.apk"
    },
    {
        id: "whist",
        name: "Whist",
        logo: "images/logo-whist.png",
        apk: "whist.apk"
    },
    {
        id: "yams",
        name: "Yams",
        logo: "images/logo-yams.png",
        apk: "yams.apk"
    }
];

function formatSize(bytes) {
    const mb = bytes / 1024 / 1024;

    return mb.toLocaleString("fr-FR", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
    }) + " Mo";
}

function formatDate(date) {
    return new Date(date).toLocaleDateString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
}

async function loadGames() {

    const container = document.getElementById("games");

    try {

        const response = await fetch(
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases?per_page=100`
        );

        if (!response.ok) {
            throw new Error("Erreur GitHub");
        }

        const releases = await response.json();

        releases.sort(
            (a, b) =>
                new Date(b.published_at) -
                new Date(a.published_at)
        );

        for (const game of games) {

            const release = releases.find(release => {

                if (release.draft || release.prerelease) {
                    return false;
                }

                if (!release.tag_name.startsWith(game.id + "-v")) {
                    return false;
                }

                return release.assets.some(
                    asset => asset.name === game.apk
                );
            });

            if (!release) {
                createUnavailableCard(container, game);
                continue;
            }

            const asset = release.assets.find(
                asset => asset.name === game.apk
            );

            const version =
                release.tag_name.replace(
                    game.id + "-v",
                    ""
                );

            createGameCard(
                container,
                game,
                version,
                asset,
                release.published_at
            );
        }

    } catch (error) {

        console.error(error);

        for (const game of games) {
            createUnavailableCard(container, game);
        }
    }
}

function createGameCard(
    container,
    game,
    version,
    asset,
    publishedAt
) {

    const card = document.createElement("a");

    card.className = "game-card";
    card.href = asset.browser_download_url;

    card.innerHTML = `
        <img src="${game.logo}" alt="${game.name}">

        <h2>${game.name}</h2>

        <div class="game-info">
            <span>Version ${version}</span>
            <span>${formatSize(asset.size)}</span>
            <span>${formatDate(publishedAt)}</span>
        </div>

        <span class="download">
            Télécharger APK
        </span>
    `;

    container.appendChild(card);
}

function createUnavailableCard(
    container,
    game
) {

    const card = document.createElement("div");

    card.className = "game-card";

    card.innerHTML = `
        <img src="${game.logo}" alt="${game.name}">

        <h2>${game.name}</h2>

        <div class="game-info error">
            <span>APK indisponible</span>
        </div>
    `;

    container.appendChild(card);
}

loadGames();

</script>

</body>
</html>
